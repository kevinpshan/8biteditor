<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel20 — 8-bit Pixel Editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1a1f; --panel: #24242c; --panel2: #2e2e38;
    --border: #3a3a48; --accent: #7c6af7; --accent-h: #9585ff;
    --text: #e8e8f0; --dim: #888899; --danger: #e05555;
  }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
    font-size:13px; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* TOPBAR */
  #topbar { display:flex; align-items:center; gap:10px; padding:0 14px; height:46px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
  .logo { font-size:15px; font-weight:700; color:var(--accent); letter-spacing:.5px; }
  .logo span { color:var(--dim); font-weight:400; }
  .sep { width:1px; height:22px; background:var(--border); margin:0 2px; }
  .btn { display:flex; align-items:center; gap:4px; padding:4px 10px;
    border:1px solid var(--border); border-radius:6px; background:var(--panel2);
    color:var(--text); cursor:pointer; font-size:12px; transition:.12s; user-select:none; white-space:nowrap; }
  .btn:hover { background:var(--border); }
  .btn.danger { border-color:#6b3333; }
  .btn.danger:hover { background:#5a2828; border-color:var(--danger); }
  #img-name { background:var(--panel2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); padding:4px 10px; font-size:13px; width:150px; }
  #img-name:focus { outline:none; border-color:var(--accent); }
  #zoom-display { font-size:12px; color:var(--dim); min-width:38px; text-align:center; }
  .spacer { flex:1; }
  label.check-label { display:flex; align-items:center; gap:5px; cursor:pointer; font-size:12px; color:var(--dim); }
  input[type=checkbox] { accent-color:var(--accent); width:14px; height:14px; cursor:pointer; }

  /* MAIN */
  #main { display:flex; flex:1; overflow:hidden; }

  /* TOOLBAR */
  #toolbar { width:54px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:3px; flex-shrink:0; }
  .tl { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-top:6px; }
  .tool-btn { width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    border:1px solid transparent; border-radius:8px; cursor:pointer; color:var(--dim);
    transition:.12s; background:transparent; position:relative; user-select:none; }
  .tool-btn:hover { background:var(--panel2); color:var(--text); }
  .tool-btn.active { background:rgba(124,106,247,.18); border-color:var(--accent); color:var(--accent); }
  .tool-btn[data-tip]:hover::after { content:attr(data-tip); position:absolute; left:calc(100% + 10px);
    top:50%; transform:translateY(-50%); background:#111118; border:1px solid var(--border);
    padding:4px 8px; border-radius:5px; white-space:nowrap; font-size:11px; color:var(--text); z-index:999; pointer-events:none; }

  /* CANVAS AREA — white workspace */
  #canvas-area { flex:1; display:flex; align-items:center; justify-content:center;
    overflow:auto; background:#e8e8e8;
    background-image: linear-gradient(45deg,#d0d0d0 25%,transparent 25%),
                      linear-gradient(-45deg,#d0d0d0 25%,transparent 25%),
                      linear-gradient(45deg,transparent 75%,#d0d0d0 75%),
                      linear-gradient(-45deg,transparent 75%,#d0d0d0 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  #canvas-wrap { position:relative; line-height:0;
    box-shadow: 0 4px 32px rgba(0,0,0,0.35), 0 0 0 1px #bbb; }
  /* The pixel canvas itself — background is white (index 0 = white in our palette mapping) */
  #pixel-canvas { display:block; image-rendering:pixelated; cursor:crosshair; }
  /* Grid drawn ON TOP via a separate canvas */
  #grid-overlay { position:absolute; inset:0; pointer-events:none; }

  /* RIGHT PANEL */
  #right-panel { width:216px; background:var(--panel); border-left:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
  .p-sec { padding:10px 12px; border-bottom:1px solid var(--border); }
  .p-lbl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.8px;
    color:var(--dim); margin-bottom:7px; }
  #color-row { display:flex; align-items:center; gap:8px; }
  #swatch { width:38px; height:38px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; }
  #c-hex { font-size:12px; font-family:monospace; }
  #c-idx { font-size:11px; color:var(--dim); margin-top:2px; }
  #pal-scroll { flex:1; overflow-y:auto; padding:10px 12px; }
  #pal-scroll::-webkit-scrollbar { width:4px; }
  #pal-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  #pal-grid { display:grid; grid-template-columns:repeat(16,1fr); gap:2px; }
  .pc { aspect-ratio:1; border-radius:2px; cursor:pointer; border:1px solid transparent; transition:.1s; }
  .pc:hover { transform:scale(1.35); z-index:2; border-color:rgba(255,255,255,.5); }
  .pc.sel { border-color:#fff !important; box-shadow:0 0 0 1px var(--accent); transform:scale(1.15); z-index:3; }

  /* STATUSBAR */
  #statusbar { height:27px; background:var(--panel); border-top:1px solid var(--border);
    display:flex; align-items:center; padding:0 14px; gap:16px; flex-shrink:0; font-size:11px; color:var(--dim); }
  #statusbar .sr { margin-left:auto; }

  /* TOAST */
  #toast { position:fixed; bottom:36px; left:50%; transform:translateX(-50%) translateY(16px);
    background:#111118; border:1px solid var(--border); padding:7px 16px; border-radius:8px;
    font-size:12px; color:var(--text); opacity:0; transition:.25s; z-index:9999; pointer-events:none; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

  /* MODAL */
  #modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
    z-index:1000; align-items:center; justify-content:center; }
  #modal-bg.on { display:flex; }
  #modal { background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:22px; min-width:270px; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  #modal h3 { margin-bottom:6px; font-size:14px; }
  #modal p { color:var(--dim); font-size:12px; margin-bottom:18px; }
  #modal .ma { display:flex; justify-content:flex-end; gap:8px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">Pixel20 <span>8-bit</span></div>
  <div class="sep"></div>
  <input id="img-name" type="text" value="untitled" spellcheck="false">
  <div class="sep"></div>
  <label class="check-label"><input type="checkbox" id="tog-grid" checked> Grid</label>
  <div class="sep"></div>
  <button class="btn" id="btn-zo">−</button>
  <span id="zoom-display">100%</span>
  <button class="btn" id="btn-zi">+</button>
  <div class="spacer"></div>
  <button class="btn danger" id="btn-clear">⌫ Clear</button>
</div>

<div id="main">
  <div id="toolbar">
    <span class="tl">Tools</span>
    <div class="tool-btn active" data-tool="pencil" data-tip="Pencil (P)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
      </svg>
    </div>
    <div class="tool-btn" data-tool="eraser" data-tip="Eraser (E)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>
      </svg>
    </div>
    <div class="tool-btn" data-tool="fill" data-tip="Fill (F)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m19 11-8-8-8.5 8.5a5.5 5.5 0 0 0 7.78 7.78L19 11Z"/><path d="m3 3 18 18"/><path d="M20.5 19.5c.5 1 .5 2-.5 3s-2.5.5-3-.5"/>
      </svg>
    </div>
    <div class="tool-btn" data-tool="eyedropper" data-tip="Eyedropper (I)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8"/>
      </svg>
    </div>
  </div>

  <div id="canvas-area">
    <div id="canvas-wrap">
      <canvas id="pixel-canvas" width="32" height="32"></canvas>
      <canvas id="grid-overlay"></canvas>
    </div>
  </div>

  <div id="right-panel">
    <div class="p-sec">
      <div class="p-lbl">Active Color</div>
      <div id="color-row">
        <div id="swatch"></div>
        <div><div id="c-hex">#000000</div><div id="c-idx">Index: 0</div></div>
      </div>
    </div>
    <div style="padding:10px 12px 4px;border-bottom:1px solid var(--border);">
      <span class="p-lbl" style="margin:0;">Palette</span>
      <span style="font-size:10px;color:var(--dim);margin-left:4px;">256 colors</span>
    </div>
    <div id="pal-scroll"><div id="pal-grid"></div></div>
  </div>
</div>

<div id="statusbar">
  <span id="s-pos">x: — &nbsp;y: —</span>
  <span id="s-col">—</span>
  <span id="s-tool">Pencil</span>
  <span class="sr">20×20 · 8-bit · 400px</span>
</div>

<div id="toast"></div>

<div id="modal-bg">
  <div id="modal">
    <h3 id="m-title">Confirm</h3>
    <p id="m-msg"></p>
    <div class="ma">
      <button class="btn" id="m-cancel">Cancel</button>
      <button class="btn danger" id="m-ok">Confirm</button>
    </div>
  </div>
</div>

<script>
// ── PALETTE: 216 web-safe + 40 extras ──
// Index 0 = WHITE (background / eraser target)
const PALETTE = (() => {
  const p = [], h = n => n.toString(16).padStart(2,'0');
  // Index 0 = white background
  p.push('#ffffff');
  // Black at index 1
  p.push('#000000');
  // 214 web-safe colors (skip pure white #ffffff and #000000 we already added)
  const s = [0,51,102,153,204,255];
  for (const r of s) for (const g of s) for (const b of s) {
    const c = `#${h(r)}${h(g)}${h(b)}`;
    if (c !== '#ffffff' && c !== '#000000') p.push(c);
    if (p.length === 216) break;
  }
  // Fill remaining up to 216 with remaining web-safe
  while (p.length < 216) p.push('#cccccc');
  // 40 extras
  ['#111111','#222222','#333333','#444444','#555555',
   '#666666','#777777','#888888','#999999','#aaaaaa',
   '#bbbbbb','#dddddd','#eeeeee','#f5f5f5','#f0f0f0',
   '#ffddcc','#ffccaa','#eebb88','#cc9966','#aa7744',
   '#ff9999','#ff6666','#cc3333','#991111','#660000',
   '#99ffcc','#66ddaa','#33bb88','#118866','#005544',
   '#99ccff','#6699ff','#3366ff','#1133cc','#000099',
   '#ffff99','#ffcc44','#ff9911','#cc6600','#884400'
  ].forEach(c => p.push(c));
  // Trim to exactly 256
  return p.slice(0, 256);
})();

const W = 20, H = 20;
const pixels = new Uint8Array(W * H); // all 0 = white — 400 pixels
let selIdx = 1, tool = 'pencil', drawing = false, lastIdx = -1, showGrid = true;

const canvas  = document.getElementById('pixel-canvas');
const ctx     = canvas.getContext('2d');
const gridCv  = document.getElementById('grid-overlay');
const gridCtx = gridCv.getContext('2d');

const ZOOM_LEVELS = [0.5, 0.75, 1, 1.5, 2, 3, 4];
let zoomI = 2;

function cellSize() { return Math.round(560 * ZOOM_LEVELS[zoomI]) / 20; }

function applyZoom() {
  const sz = Math.round(560 * ZOOM_LEVELS[zoomI]);
  canvas.style.width  = sz + 'px';
  canvas.style.height = sz + 'px';
  gridCv.style.width  = sz + 'px';
  gridCv.style.height = sz + 'px';
  gridCv.width  = sz;
  gridCv.height = sz;
  document.getElementById('zoom-display').textContent = Math.round(ZOOM_LEVELS[zoomI]*100) + '%';
  drawGrid();
}

function drawGrid() {
  const s = gridCv.width;
  const c = s / 32;
  gridCtx.clearRect(0, 0, s, s);
  if (!showGrid) return;

  // Every-pixel lines — fine medium gray
  gridCtx.strokeStyle = 'rgba(0,0,0,0.15)';
  gridCtx.lineWidth = 0.5;
  for (let i = 0; i <= 20; i++) {
    const pos = Math.round(i * c) + 0.5;
    gridCtx.beginPath(); gridCtx.moveTo(pos, 0); gridCtx.lineTo(pos, s); gridCtx.stroke();
    gridCtx.beginPath(); gridCtx.moveTo(0, pos); gridCtx.lineTo(s, pos); gridCtx.stroke();
  }

  // Every-5-pixel major lines — stronger
  gridCtx.strokeStyle = 'rgba(0,0,0,0.35)';
  gridCtx.lineWidth = 1;
  for (let i = 0; i <= 20; i += 5) {
    const pos = Math.round(i * c) + 0.5;
    gridCtx.beginPath(); gridCtx.moveTo(pos, 0); gridCtx.lineTo(pos, s); gridCtx.stroke();
    gridCtx.beginPath(); gridCtx.moveTo(0, pos); gridCtx.lineTo(s, pos); gridCtx.stroke();
  }
}

function render() {
  // Fill white background first (for index 0 pixels)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < W*H; i++) {
    if (pixels[i] === 0) continue; // white = background, already drawn
    ctx.fillStyle = PALETTE[pixels[i]];
    ctx.fillRect(i % W, Math.floor(i / W), 1, 1);
  }
}

function renderOne(i) {
  ctx.fillStyle = PALETTE[pixels[i]];
  ctx.fillRect(i % W, Math.floor(i / W), 1, 1);
}

// ── Palette UI ──
const pg = document.getElementById('pal-grid');
PALETTE.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'pc' + (i === selIdx ? ' sel' : '');
  // White swatch needs a visible border so it shows up in the dark panel
  el.style.background = c;
  if (c === '#ffffff' || c === '#f5f5f5' || c === '#f0f0f0' || c === '#eeeeee')
    el.style.border = '1px solid #666';
  el.title = `${c} [${i}]`;
  el.addEventListener('click', () => pickColor(i));
  pg.appendChild(el);
});

function pickColor(i) {
  pg.children[selIdx].classList.remove('sel');
  selIdx = i;
  pg.children[i].classList.add('sel');
  document.getElementById('swatch').style.background = PALETTE[i];
  document.getElementById('c-hex').textContent = PALETTE[i].toUpperCase();
  document.getElementById('c-idx').textContent = `Index: ${i}`;
}
pickColor(1); // start on black

// ── Canvas interaction ──
function pixelIdx(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) * W / r.width);
  const y = Math.floor((e.clientY - r.top) * H / r.height);
  return (x < 0 || x >= W || y < 0 || y >= H) ? -1 : y * W + x;
}

function paint(i) {
  if (i < 0 || i === lastIdx) return;
  lastIdx = i;
  if (tool === 'pencil') pixels[i] = selIdx;
  else if (tool === 'eraser') pixels[i] = 0;
  renderOne(i);
}

function fill(start, newC) {
  const tgt = pixels[start];
  if (tgt === newC) return;
  const q = [start], vis = new Uint8Array(W * H);
  while (q.length) {
    const i = q.pop();
    if (i < 0 || i >= W * H || vis[i] || pixels[i] !== tgt) continue;
    vis[i] = 1; pixels[i] = newC;
    const x = i % W, y = Math.floor(i / W);
    if (x > 0)     q.push(i - 1);
    if (x < W - 1) q.push(i + 1);
    if (y > 0)     q.push(i - W);
    if (y < H - 1) q.push(i + W);
  }
  render();
}

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const i = pixelIdx(e);
  if (i < 0) return;
  if (e.altKey || tool === 'eyedropper') {
    pickColor(pixels[i]);
    toast(`Picked: ${PALETTE[pixels[i]]} [${pixels[i]}]`);
    return;
  }
  if (tool === 'fill') { fill(i, selIdx); return; }
  drawing = true; lastIdx = -1;
  canvas.setPointerCapture(e.pointerId);
  paint(i); status(i);
});
canvas.addEventListener('pointermove', e => {
  const i = pixelIdx(e);
  if (i >= 0) status(i);
  if (drawing) paint(i);
});
canvas.addEventListener('pointerup',     () => { drawing = false; lastIdx = -1; });
canvas.addEventListener('pointercancel', () => { drawing = false; lastIdx = -1; });
canvas.addEventListener('pointerleave',  () => {
  document.getElementById('s-pos').textContent = 'x: — \u00a0y: —';
  document.getElementById('s-col').textContent = '—';
});

function status(i) {
  if (i < 0) return;
  const x = i % W, y = Math.floor(i / W);
  document.getElementById('s-pos').textContent = `x:${x} \u00a0y:${y}`;
  document.getElementById('s-col').textContent = `${PALETTE[pixels[i]]} [${pixels[i]}]`;
}

// ── Tools ──
document.querySelectorAll('.tool-btn[data-tool]').forEach(b =>
  b.addEventListener('click', () => setTool(b.dataset.tool)));

function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tool-btn[data-tool="${t}"]`).classList.add('active');
  document.getElementById('s-tool').textContent =
    ({pencil:'Pencil', eraser:'Eraser', fill:'Fill', eyedropper:'Eyedropper'})[t] || t;
  canvas.style.cursor = t === 'eraser' ? 'cell' : 'crosshair';
}

// ── Clear ──
document.getElementById('btn-clear').addEventListener('click', () =>
  modal('Clear Canvas', 'Reset all pixels to white (index 0)?', () => {
    pixels.fill(0); render(); toast('Canvas cleared');
  }));

// ── Grid toggle ──
document.getElementById('tog-grid').addEventListener('change', e => {
  showGrid = e.target.checked; drawGrid();
});

// ── Zoom ──
document.getElementById('btn-zi').addEventListener('click', () => {
  if (zoomI < ZOOM_LEVELS.length - 1) { zoomI++; applyZoom(); }
});
document.getElementById('btn-zo').addEventListener('click', () => {
  if (zoomI > 0) { zoomI--; applyZoom(); }
});
document.getElementById('canvas-area').addEventListener('wheel', e => {
  e.preventDefault();
  if (e.deltaY < 0 && zoomI < ZOOM_LEVELS.length - 1) { zoomI++; applyZoom(); }
  if (e.deltaY > 0 && zoomI > 0) { zoomI--; applyZoom(); }
}, { passive: false });

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  ({
    p: () => setTool('pencil'),
    e: () => setTool('eraser'),
    f: () => setTool('fill'),
    i: () => setTool('eyedropper'),
    '[': () => { if (zoomI > 0) { zoomI--; applyZoom(); } },
    ']': () => { if (zoomI < ZOOM_LEVELS.length - 1) { zoomI++; applyZoom(); } },
  })[e.key.toLowerCase()]?.();
});

// ── Toast ──
let toastT;
function toast(msg, ms = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), ms);
}

// ── Modal ──
let modalCb;
function modal(title, msg, cb) {
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-msg').textContent = msg;
  document.getElementById('modal-bg').classList.add('on');
  modalCb = cb;
}
document.getElementById('m-cancel').addEventListener('click', () =>
  document.getElementById('modal-bg').classList.remove('on'));
document.getElementById('m-ok').addEventListener('click', () => {
  document.getElementById('modal-bg').classList.remove('on');
  modalCb?.();
});
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-bg'))
    document.getElementById('modal-bg').classList.remove('on');
});

// ── Init ──
applyZoom();
render();
toast('Pixel32 ready · P Pencil · E Eraser · F Fill · I Eyedropper · scroll to zoom', 4000);
</script>
</body>
</html>
